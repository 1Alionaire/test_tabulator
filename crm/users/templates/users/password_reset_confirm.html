{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link type="text/css" href="{% static 'users/css/styles.css' %}" rel="stylesheet">
{% endblock %}


{% block content %}
<div class="login-page">
    <form class="login-card" method="post">
        {% csrf_token %}
        <h1 class="login-title">New password</h1>

        <div class="form-error">{{ form.non_field_errors }}</div>
        {% for f in form %}
            <div class="form-group">
                <label class="form-label" for="{{ f.id_for_label }}">{{f.label}}: </label>{{ f }}</p>
                <div class="form-error">{{ f.errors }}</div>
            </div>
        {% endfor %}

        <p><button class="login-btn" type="submit">     Save    </button></p>
    </form>
</div>
{% endblock %}
