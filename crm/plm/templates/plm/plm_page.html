{% extends 'base.html' %} {% load static %} {% block extra_css %}
<link
  type="text/css"
  href="{% static 'plm/css/plm_page.css' %}"
  rel="stylesheet"
/>{% endblock %} {% block content%}
<main class="main">
  <section class="main-window">
    <section class="control-panel">
      <button type="button" id="tab-entry" class="panel-btn active">
        Entry
      </button>
      <button type="button" id="tab-weight" class="panel-btn">Weight</button>
      <button type="button" id="tab-nob-analysis" class="panel-btn">NOB</button>
      <button type="button" id="tab-tem-anaysis" class="panel-btn">TEM</button>
      <button type="button" id="tab-result" class="panel-btn">Result</button>
      <button type="button" id="tab-invoice" class="panel-btn">Invoice</button>
    </section>
    <section class="work-space">
      <div class="tab-content active" id="tab-0">
        <section class="section-control-panel" id="data-entry-control-panel">
          <div class="control-buttons">
            <button type="button" id="data-entry-save-toggle" class="panel-btn">
              Save
            </button>
            <button
              type="button"
              id="data-entry-refresh-toggle"
              class="panel-btn"
            >
              Refresh
            </button>
            <button
              type="button"
              id="data-entry-insert-toggle"
              class="panel-btn"
            >
              Insert row
            </button>
            <button
              type="button"
              id="data-entry-delete-toggle"
              class="panel-btn"
            >
              Delete row
            </button>
          </div>
          <div class="data-entry-date-collected-container">
            <label for="start">Date collected</label>
            <input type="date" id="data-entry-date-collected" />
            <button id="data-entry-date-collected-btn-confirm">Confirm</button>
          </div>
          <div id="data-entry-upload-excel-form">
            <form
              action="{% url 'plm:data_entry_upload_excel' work.id %}"
              class="data-entry-upload-excel-form"
              method="POST"
              enctype="multipart/form-data"
            >
              {% csrf_token %}
              <!-- Label for accessibility -->
              <label for="file-upload">Choose a file to upload:</label>

              <!-- The actual file input field -->
              <input
                type="file"
                id="data-entry-file-upload"
                name="uploaded_file"
              />

              <!-- Submit button -->
              <button type="submit">Upload File</button>
            </form>
          </div>
        </section>

        <section class="section-table">
          <section id="samples-data-entry-table"></section>
        </section>
      </div>
      <div class="tab-content" id="tab-1">
        <section class="section-control-panel" id="weight-control-panel">
          <div class="control-buttons">
            <button type="button" id="weight-save-toggle" class="panel-btn">
              Save
            </button>
            <button type="button" id="weight-refresh-toggle" class="panel-btn">
              Refresh
            </button>
            <button type="button" id="weight-insert-toggle" class="panel-btn">
              Insert row
            </button>
            <button type="button" id="weight-delete-toggle" class="panel-btn">
              Delete row
            </button>
            <button type="button" id="weight-test-toggle" class="panel-btn">
              Test
            </button>
          </div>
        </section>

        <section class="section-table">
          <section id="samples-weight-table"></section>
        </section>
      </div>
      <div class="tab-content" id="tab-2">
        <section class="section-control-panel" id="nob-control-panel">
          <div class="tem-control-buttons">
            <button type="button" id="nob-save-toggle" class="panel-btn">
              Save
            </button>
            <button type="button" id="nob-refresh-toggle" class="panel-btn">
              Refresh
            </button>
          </div>
          <div class="temperature-control-panel">
            <div class="temperature-label"><span>Temperature</span></div>
            <select class="plm-analysis-temperature-select">
              <option value="19">19</option>
              <option value="21">21</option>
              <option value="23">23</option>
              <option value="25">25</option>
              <option value="27">27</option>
            </select>
          </div>
          <div class="nob-analyst-info-container">
            <span>Analyst: </span>
            <span id="nob-analyst-username"></span>
          </div>
          <div class="nob-date-analysis-container">
            <label>Date analysis</label>
            <input type="date" id="nob-date-analysis" />
            <button id="nob-date-analysis-btn-confirm">Confirm</button>
          </div>
          <div class="nob-reviewer-info-container">
            <span>Reviewer: </span>
            <select id="nob-analysis-reviewer-list"></select>
            <button id="nob-choose-reviewer-btn-confirm">Confirm</button>
          </div>
          <div class="nob-date-review-container">
            <label>Date review</label>
            <input type="date" id="nob-date-review" />
            <button id="nob-date-review-btn-confirm">Confirm</button>
          </div>
          <div class="tem-control-buttons">
            <button type="button" id="nob-qc-generate-toggle" class="panel-btn">
              QC Generate samples
            </button>
            <button type="button" id="nob-qc-complete-toggle" class="panel-btn">
              Complete QC
            </button>
          </div>
        </section>

        <section class="section-table">
          <section id="samples-nob-table"></section>
          <div class="table-overlay" id="take-nob-overlay">
            <div class="table-overlay__box">
              <p>No analyst in project</p>
              <button type="button" class="take-btn">Start working on</button>
            </div>
          </div>
        </section>
      </div>
      <div class="tab-content" id="tab-3">
        <section class="section-control-panel" id="tem-control-panel">
          <div class="tem-control-buttons">
            <button type="button" id="tem-save-toggle" class="panel-btn">
              Save
            </button>
            <button type="button" id="tem-refresh-toggle" class="panel-btn">
              Refresh
            </button>
          </div>
        </section>
        <section class="section-table">
          <section id="samples-tem-table"></section>
          <div class="table-overlay" id="take-tem-overlay">
            <div class="table-overlay__box">
              <p>No analyst in project</p>
              <button type="button" class="take-btn">Start working on</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </section>
</main>
{% endblock%} {% block extra_js %}
<script>
  const URLS = {
    tableOptionsGetURL: "{% url 'plm:api_get_table_options' %}",
    dataEntryGetURL: "{% url 'plm:api_get_data_entry_table' work.id %}",
    dataEntryUpdateURL: "{% url 'plm:api_update_data_entry_table' work.id %}",
    dataEntryReplaceAllURL:
      "{% url 'plm:api_replace_all_data_entry_table' work.id %}",

    weightGetURL: "{% url 'plm:api_get_weight_table' work.id %}",
    weightUpdateURL: "{% url 'plm:api_update_weight_table' work.id %}",

    nobGetURL: "{% url 'plm:api_get_nob_analysis_table' work.id %}",
    temGetURL: "{% url 'plm:api_get_tem_analysis_table' work.id %}",
    analysisUpdateURL: "{% url 'plm:api_update_analysis_table' work.id %}",

    temperatureGetURL: "{% url 'plm:api_get_temperature' work.id %}",
    projectDateGetURL: "{% url 'plm:api_get_projects_date' work.id %}", //
    projectDateUpdateURL: "{% url 'plm:api_update_projects_date' work.id %}",

    projectAnalystGetURL: "{% url 'plm:api_get_projects_analyst' work.id %}", //
    projectAnalystUpdateURL:
      "{% url 'plm:api_update_projects_analyst' work.id %}", //api_get_projects_reviewer

    projectReviewerListGetURL:
      "{% url 'plm:api_get_projects_reviewer' work.id %}", //
    projectReviewerUpdateRL:
      "{% url 'plm:api_update_project_reviewer' work.id %}", //api_generate_qc_samples

    qcGenerateSamplesURL: "{% url 'plm:api_generate_qc_samples' work.id %}",
  };
</script>

<script src="{% static 'plm/js/plm_entry.js' %}"></script>
<script src="{% static 'plm/js/plm_weight.js' %}"></script>
<script src="{% static 'plm/js/plm_nob_analysis.js' %}"></script>
<script src="{% static 'plm/js/plm_tem_analysis.js' %}"></script>
{% endblock %}
