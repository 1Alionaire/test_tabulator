{% extends 'base.html' %} {% load static %} {% block content%}
<main class="main">
  <section id="main-section-filter" class="side-filter-panel invisible">
    <form id="filter-form" method="get">
    <div class="date-filter-input-box">
      <div class="input-filter-field">
        <label>Lab ID</label>
        <input class = "input-filter-text" id="filter-input-lab-id" type="input" name="lab_id"></input>
      </div>
      <span>Date Range</span>
      <div class="date-filter">
        <label>Start</label>
        <input id="filter-input-date-start" type="date" name="date_registered__gte"></input>
      </div>
      <div class="date-filter">
        <label>End</label>
        <input id="filter-input-date-end" type="date" name="date_registered__lte"></input>
      </div>
      <div class="option-filter">
        <label>Type</label>
        <select id="filter-input-sample-type" multiple name="project_type">
        </select>
      </div>
      <div class="option-filter">
        <label>Company</label>
        <select id="filter-input-company" size="10" name="company" multiple>
        </select>
      </div>
      <div class="option-filter">
        <label>Status</label>
        <select id="filter-input-status" multiple name="status">
        </select>
      </div>
      <div class="option-filter">
        <label>Turn Time</label>
        <select id="filter-input-turn-around-time" multiple name="turn_around_time">
        </select>
      </div>
      <div class="input-filter-field">
        <label>Project Name</label>
        <input class = "input-filter-text" id="filter-input-project-name" type="text" name="project_name"></input>
      </div>
      <div class="input-filter-field">
        <label>Project Address</label>
        <input class = "input-filter-text" id="filter-input-project-address" type="text" name="project_address"></input>
      </div>
      <button type="submit">Apply</button>
    </div>
    </form>
<!--    <button id="filter-panel-apply-button">Apply</button>-->
    <button id="filter-reset">Reset</button>
  </section>
  <section class="main-window">
    <section class="control-panel">
      <button type="button" id="main-menu-filter-toggle" class="panel-btn">
        Filter
      </button>
      <button type="button" id="main-menu-create-toggle" class="panel-btn">
        Create
      </button>
      <button type="button" id="main-menu-save-toggle" class="panel-btn">
        Save
      </button>
      <button type="button" id="main-menu-refresh-toggle" class="panel-btn">
        Refresh
      </button>
      <button type="button" id="main-menu-delete-toggle" class="panel-btn">
        Delete
      </button>
      <button type="button" id="main-menu-undo-toggle" class="panel-btn">
        Undo
      </button>
      <button type="button" id="main-menu-redo-toggle" class="panel-btn">
        Redo
      </button>
      <button type="button" id="main-menu-test-toggle" class="panel-btn">
        Test
      </button>
    </section>
    <section id="main-info"></section>
    
  </section>
</main>
{% endblock%} {% block extra_js %}
<script>
  // Этот блок ВНУТРИ шаблона, поэтому Django-теги работают
  const URLS = {
    tableOptionsGetURL: "{% url 'main:api_get_table_options' %}",
    mainProjectGetURL: "{% url 'api:v1:main:get_main_projects_table' %}",
    mainProjectUpdateURL: "{% url 'main:api_update_main_projects_table' %}",
  };
</script>

<script src="{% static 'main/js/render_table.js' %}"></script>
{% endblock %}
