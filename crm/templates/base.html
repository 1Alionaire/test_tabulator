{% load auth_tags %} {% load static %}

<!doctype html>
<html lang="en">
  <head>
    <title>{{title}}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <link
      href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <!-- после Tabulator, чтобы наши правила перекрывали его стили -->
    <link
      type="text/css"
      href="{% static 'main/css/styles.css' %}"
      rel="stylesheet"
    />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navigation-main">
      <div class="nav-left">
        <a href="{% url 'main:main' %}" class="nav-tab">Main</a>

        <div class="dropdown">
          <button type="button" class="dropdown-toggle">Analysis</button>
          <ul class="dropdown-menu">
            <li>
              <a href="" class="analysis-nav-tab">PCM</a>
            </li>
            <li>
              <a href="{%url 'plm:main' %}" class="analysis-nav-tab">PLM</a>
            </li>
            <li>
              <a href="" class="analysis-nav-tab">LEAD</a>
            </li>
            <li>
              <a href="" class="analysis-nav-tab">MOLD</a>
            </li>
            <li>
              <a href="{%url 'tem:tem_main_menu' %}" class="analysis-nav-tab"
                >TEM</a
              >
            </li>
          </ul>
        </div>

        <a href="" class="nav-tab">QC</a>
        <a href="" class="nav-tab">FINANCE</a>
      </div>
      {% if user.is_authenticated %}
      <div class="nav-right">
        <a class="nav-username" href="{% url 'users:profile' %}"
          >{{user.username}}</a
        >
        <form
          method="post"
          action="{% url 'users:logout' %}"
          class="logout-form"
        >
          {% csrf_token %}
          <button class="logout-button" type="submit">Logout</button>
        </form>
      </div>
      {% endif %}
    </nav>

    {% block content %} {% endblock %}
    <div id="toast-container"></div>
    <script>
      document.querySelectorAll(".dropdown-toggle").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation(); // чтобы обработчик на document не закрыл сразу же
          btn.parentElement.classList.toggle("open");
        });
      });

      // закрытие при клике вне меню
      document.addEventListener("click", () => {
        document
          .querySelectorAll(".dropdown.open")
          .forEach((d) => d.classList.remove("open"));
      });

      // ================ show notification ==============
      function showToast(message, type = "info", duration = 3000) {
        const container = document.getElementById("toast-container");

        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message; // textContent, а не innerHTML —
        // сообщения с сервера могут содержать HTML/XSS

        container.appendChild(toast);

        // Элемент только что вставлен со стилями opacity:0.
        // Если сразу навесить .show, браузер объединит оба состояния в один пересчёт
        // и transition не сработает. requestAnimationFrame даёт браузеру
        // отрисовать начальное состояние, и только потом меняем классы.
        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
          toast.classList.remove("show");
          // ждём окончания transition, потом удаляем узел из DOM
          toast.addEventListener("transitionend", () => toast.remove(), {
            once: true,
          });
        }, duration);
      }

      // ================ show error from failed fetch response ==============
      async function showResponseError(response) {
        // сервер отдаёт {"error": "..."}; если тело не JSON (например, HTML-страница 500) — показываем код
        const body = await response.json().catch(() => ({}));
        showToast(`Error: ${body.error ?? response.status}`, "error");
      }
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
