{% extends 'base.html' %} {% load static %} {% block extra_css %}
<link
  type="text/css"
  href="{% static 'pcm/css/pcm_page.css' %}"
  rel="stylesheet"
/>{% endblock %} {% block content %}
<div class="pcm-time-table-main-page-actions pcm-time-table-picker">
  <div class="pcm-time-table-picker__header">
    <h1 class="pcm-time-table-picker__title">PCM Time Table</h1>
  </div>
  <div class="pcm-time-table-main-actions-box">
    {% for year in years %}
    <a
      href="{% url 'pcm:time_table_by_month' year %}"
      class="pcm-time-table-main-action-btn"
    >
      {{ year }}
    </a>
    {% empty %}
    <p class="pcm-time-table-picker__empty">No time table records yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
